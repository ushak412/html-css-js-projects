<!DOCTYPE html>
<html>
    <head>
        <title>Social Login</title>
        <link rel="stylesheet" href="social-login-styles.css">
        <!--
        The viewport meta tag tells mobile browsers how wide to make the viewport and how much to zoom, so the page is laid out for the
        device's real screen size.

        Without it, phones pretend the screen is about 980px wide, render the page at that width, and shrink it to fit. The page looks tiny,
        and CSS (like media queries and 100%/vw units) sees 980px instead of the real width.

        width=device-width: make the viewport as wide as the device's screen. initial-scale=1: start at 100% zoom, with no shrinking or enlarging.

        Why it matters: media queries such as (width < 550px) work, layouts adapt to the real screen, text is readable without pinch-zooming, and search engines treat the page as mobile-friendly.

        Place it inside <head>. Avoid user-scalable=no and maximum-scale=1,because they block pinch-to-zoom and hurt accessibility.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
